name: Autonomous AI Outreach Engine

on:
  schedule:
    # Run twice daily at 09:00 UTC and 17:00 UTC (Monday - Friday)
    - cron: "0 9,17 * * 1-5"
  workflow_dispatch:
    inputs:
      target_applications:
        description: "Number of qualified applications to target"
        required: true
        default: "5"
      mode:
        description: "Sourcing Mode"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - remote-jobs
          - funded-startups
      dispatch_mode:
        description: "Dispatch Mode (send = live email, draft = Gmail drafts, dry-run = simulation)"
        required: true
        default: "send"
        type: choice
        options:
          - send
          - draft
          - dry-run
      dry_run:
        description: "Force Dry-Run (Overrides dispatch mode)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-outreach:
    name: Execute Outreach Cycle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Candidate Profile
        env:
          PROFILE_SECRET: ${{ secrets.CANDIDATE_PROFILE_JSON }}
        run: |
          if [ -n "$PROFILE_SECRET" ]; then
            echo "$PROFILE_SECRET" > config/profile.json
            echo "Loaded candidate profile from repository secret."
          elif [ ! -f "config/profile.json" ]; then
            cp config/profile.example.json config/profile.json
            echo "Using default profile.example.json template."
          fi

      - name: Execute Multi-Agent Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY || secrets.NOTION_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || secrets.GMAIL_SENDER }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER || secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISPATCH_MODE: ${{ secrets.DISPATCH_MODE || 'draft' }}
        run: |
          FLAGS="--mode ${{ github.event.inputs.mode || 'all' }} --target ${{ github.event.inputs.target_applications || '5' }}"
          INPUT_MODE="${{ github.event.inputs.dispatch_mode }}"
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [[ "$INPUT_MODE" == *"dry-run"* ]]; then
            FLAGS="$FLAGS --dry-run"
          elif [[ "$INPUT_MODE" == *"send"* ]]; then
            FLAGS="$FLAGS --dispatch-mode send --dispatch"
          elif [[ "$INPUT_MODE" == *"draft"* ]]; then
            FLAGS="$FLAGS --dispatch-mode draft --dispatch"
          else
            # Default fallback to secret or draft
            FLAGS="$FLAGS --dispatch"
          fi

          echo "Running outreach engine with: python run_agent.py $FLAGS"
          python run_agent.py $FLAGS

      - name: Upload Generated PDF Resumes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailored-resumes
          path: |
            generated_resumes/*.pdf
            data/resumes/*.pdf
          retention-days: 14

      - name: Commit & Sync Deduplication Ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/ data/applications.csv .seen_companies.json .api_offset.json || true
          if git diff --staged --quiet; then
            echo "No new companies to record in ledger."
          else
            git commit -m "chore(ledger): record newly evaluated companies [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "Push skipped"
          fi
